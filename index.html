<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Blog do Vozinha</title>

<style>
header {
background-color: rgb(136, 39, 134);
color: rgb(243, 194, 16);
text-align: center;
max-width: 800px;
margin: 0 auto;
border: 5px solid red;
padding: 16px;
display: flex;
flex-direction: column;
align-items: center;
}

main {
background-color: black;
color: white;
max-width: 800px;
margin: 0 auto;
padding: 16px;
}

img {
width: 220px;
height: 160px;
object-fit: cover;
}

.artigo-autor {
font-weight: bold;
}

button {
cursor: pointer;
padding: 8px 12px;
font-size: 18px;
}
</style>
</head>

<body>
<header>
<h1>Club do Vozinha Destruidor de Crack</h1>
<p>
Descubra mais sobre o goleiro que fecha o gol
da seleção de Cabo Verde.
</p>
</header>

<main>
<img
src="Gemini_Generated_Image_qiubxhqiubxhqiub.png"
alt="Imagem do Vozinha"
>

<div>
<h2>Boas-vindas</h2>
<p>Seja bem-vindo ao site do Vozinha!</p>
<p class="artigo-autor">Por: Pietro Perandre</p>

<button type="button">
<button>❤️ <span>0</span></button>
<button>🤏<span>0</span></button>
</button>
</div>

<img
src="Gemini_Generated_Image_qiubxhqiubxhqiub.png"
alt="Imagem do Vozinha"
>

<div>
<h2>Boas-vindas</h2>
<p>Seja bem-vindo ao site do Vozinha!</p>
<p class="artigo-autor">Por: Pietro Perandre</p>

<button type="button">
❤️ <span>0</span>
</button>
</div>
</main>

<script>
const botao = document.querySelector("main button");

botao.addEventListener("click", botaoClicado);

function botaoClicado() {
const texto = botao.querySelector("span");
texto.textContent = Number(texto.textContent) + 1;
}
</script>
</body>
</html>
